{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <h3 class="text-white mb-4">Postar uma Atividade</h3>
            <div class="card bg-dark text-light border-secondary mb-4 shadow-sm">
                <div class="card-body">
                    <form action="{% url 'criar_post' %}" method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="d-flex mb-3">
                            <div class="me-3">
                                {% if user.profile.avatar %}
                                    <img src="{{ user.profile.avatar.url }}" class="rounded-circle" style="width: 40px; height: 40px; object-fit: cover;">
                                {% else %}
                                    <div class="rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                                        {{ user.username|first|upper }}
                                    </div>
                                {% endif %}
                            </div>
                            <div class="flex-grow-1">
                                <textarea name="content" class="form-control bg-dark text-light border-secondary" rows="4" placeholder="No que você está pensando?" required style="resize: none;"></textarea>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <div class="d-flex gap-2">
                                <label for="imageUpload" class="btn btn-outline-secondary btn-sm rounded-circle" title="Adicionar foto">
                                    <i class="bi bi-image"></i>
                                </label>
                                <input type="file" id="imageUpload" name="image" class="d-none" accept="image/*">

                                <label for="videoUpload" class="btn btn-outline-secondary btn-sm rounded-circle" title="Adicionar vídeo">
                                    <i class="bi bi-camera-video"></i>
                                </label>
                                <input type="file" id="videoUpload" name="video" class="d-none" accept="video/*">

                                <label for="audioUpload" class="btn btn-outline-secondary btn-sm rounded-circle" title="Adicionar música/áudio">
                                    <i class="bi bi-music-note-beamed"></i>
                                </label>
                                <input type="file" id="audioUpload" name="audio" class="d-none" accept="audio/*">
                            </div>
                            <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">Postar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
