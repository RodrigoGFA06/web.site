{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h3 class="text-white mb-4 fw-bold">Mensagens</h3>
            <div class="card glass-panel text-light border-0 mb-4 rounded-4" style="height: 60vh;">
                <div class="card-body d-flex flex-column align-items-center justify-content-center text-muted">
                    <i class="bi bi-chat-dots fs-1 mb-3"></i>
                    <h5 class="text-white">Suas mensagens aparecerão aqui</h5>
                    <p>Selecione um amigo para começar a conversar.</p>
                    <button class="btn btn-spider rounded-pill mt-3 px-4 fw-bold">Nova Mensagem</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
